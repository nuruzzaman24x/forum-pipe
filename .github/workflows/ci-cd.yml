name: CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, dom, filter, gd, json
          coverage: none
          tools: composer:v2

      - name: Copy .env
        run: cp .env.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generate app key
        run: php artisan key:generate

      - name: Configure test database
        run: |
          sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=laravel_test/' .env
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=root/' .env

      - name: Set directory permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.20'

      - name: Install NPM dependencies
        run: npm install

      - name: Build frontend assets
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run test suite
        run: php artisan test

  deploy:
    name: Deploy to Production
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            RELEASE_DIR="$DEPLOY_PATH/releases/$(date +%Y%m%d%H%M%S)"

            mkdir -p "$RELEASE_DIR"
            cd "$RELEASE_DIR"

            git clone --depth 1 --branch master https://github.com/${{ github.repository }}.git .

            ln -nfs "$DEPLOY_PATH/shared/.env" "$RELEASE_DIR/.env"
            rm -rf "$RELEASE_DIR/storage"
            ln -nfs "$DEPLOY_PATH/shared/storage" "$RELEASE_DIR/storage"

            sudo chown -R nuruzzaman:www-data "$DEPLOY_PATH/shared/storage"
            sudo find "$DEPLOY_PATH/shared/storage" -type d -exec chmod 775 {} \;
            sudo find "$DEPLOY_PATH/shared/storage" -type f -exec chmod 664 {} \;

            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            sudo chown -R nuruzzaman:www-data "$RELEASE_DIR/bootstrap/cache"
            sudo chmod -R 775 "$RELEASE_DIR/bootstrap/cache"

            npm install
            NODE_OPTIONS=--openssl-legacy-provider npm run production

            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan storage:link || true

            ln -nfs "$RELEASE_DIR" "$DEPLOY_PATH/current"

            sudo systemctl reload php7.4-fpm

            cd "$DEPLOY_PATH/releases" && ls -dt */ | tail -n +6 | xargs -r rm -rf
          ENDSSH

      - name: Health check
        run: |
          sleep 5
          curl -sSf http://172.17.0.236/ || exit 1
